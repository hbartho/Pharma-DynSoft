name: Installateur Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version affichée (ex. 1.2.0)"
        required: false
        default: ""

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}";
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then V="${{ github.event.inputs.version }}";
          else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compiler
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} deploy\windows\DynSoftPharma.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: Setup-DynSoftPharma-${{ steps.ver.outputs.version }}
          path: deploy/windows/Output/*.exe

      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/windows/Output/*.exe
          generate_release_notes: true
